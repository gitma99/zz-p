# BotPanel Apache Performance Config

# Gzip compression
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json text/html text/plain text/css application/javascript text/xml
</IfModule>

# Keep-Alive Settings
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100

# MPM Event Configuration tuning for high concurrent webhook request volume
# 1 vCPU / 2 GB host: 150 request workers meant up to 150 PHP processes, which
# can exhaust RAM on its own, and each one wants a MySQL connection. Kept at 60
# to match MySQL's max-connections (docker/mysql/lowcpu.cnf) so requests queue
# at Apache instead of failing with "Too many connections".
<IfModule mpm_event_module>
    StartServers            2
    MinSpareThreads         25
    MaxSpareThreads         50
    ThreadLimit             64
    ThreadsPerChild         25
    MaxRequestWorkers       60
    MaxConnectionsPerChild  1000
</IfModule>

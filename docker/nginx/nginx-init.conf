# Minimal Nginx configuration used ONLY during Let's Encrypt certificate bootstrap.
# No SSL blocks, no upstream references — just serves the ACME HTTP challenge.
# The full config (nginx.conf.template) is used during normal operation.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Serve Let's Encrypt ACME challenge files
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Drop everything else
    location / {
        return 444;
    }
}

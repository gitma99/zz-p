services:
  app:
    build: .
    container_name: zzpanel_app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    environment:
      DB_HOST: mysql
    volumes:
      - ./logs/app:/var/www/html/ZZPanelBot/logs
      - ./logs/apache:/var/log/apache2
      - app_temp:/var/www/html/ZZPanelBot/temp
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: zzpanel_mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      # tuning lives ONLY in lowcpu.cnf — never duplicate the values via command: (drift risk)
      - ./docker/mysql/lowcpu.cnf:/etc/mysql/conf.d/lowcpu.cnf:ro
      - ./logs/mysql:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5
    container_name: zzpanel_phpmyadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DOMAIN}/phpmyadmin/
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: zzpanel_nginx
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    container_name: zzpanel_certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

  backup:
    build:
      context: ./docker/backup
    container_name: zzpanel_backup
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      BACKUP_TELEGRAM_TOKEN: ${BACKUP_TELEGRAM_TOKEN:-}
      BACKUP_CHAT_ID: ${BACKUP_CHAT_ID:-}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-}
      BACKUP_MAX_RETRIES: ${BACKUP_MAX_RETRIES:-}
    volumes:
      - ./data/backups:/backups
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  worker:
    build: .
    container_name: zzpanel_worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    environment:
      DB_HOST: mysql
    volumes:
      - ./logs/worker:/var/www/html/ZZPanelBot/logs
      - app_temp:/var/www/html/ZZPanelBot/temp
    command: ["worker"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_temp:

name: Release - Publish & Version

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: string
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata Action for App
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.string.outputs.owner }}/zzpanel-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Docker Metadata Action for Backup
        id: meta_backup
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.string.outputs.owner }}/zzpanel-backup
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Release App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.string.outputs.owner }}/zzpanel-app:nightly

      - name: Build and Push Release Backup
        uses: docker/build-push-action@v5
        with:
          context: ./docker/backup
          push: true
          tags: ${{ steps.meta_backup.outputs.tags }}
          labels: ${{ steps.meta_backup.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.string.outputs.owner }}/zzpanel-backup:nightly

      - name: Archive Setup Files
        run: |
          zip -r zzpanel-docker-setup.zip docker/ docker-compose.yml .env.example

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: zzpanel-docker-setup.zip
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

name: CI - Build Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - '**'
              - '!docker/backup/**'
              - '!docs/**'
            backup:
              - 'docker/backup/**'

      - name: Lowercase Repository Owner
        if: steps.filter.outputs.app == 'true' || steps.filter.outputs.backup == 'true'
        id: string
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        if: steps.filter.outputs.app == 'true' || steps.filter.outputs.backup == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.filter.outputs.app == 'true' || steps.filter.outputs.backup == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.app == 'true' || steps.filter.outputs.backup == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build App (no push)
        if: steps.filter.outputs.app == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/${{ steps.string.outputs.owner }}/zzpanel-app:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.string.outputs.owner }}/zzpanel-app:nightly

      - name: Build Backup (no push)
        if: steps.filter.outputs.backup == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./docker/backup
          push: false
          tags: ghcr.io/${{ steps.string.outputs.owner }}/zzpanel-backup:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.string.outputs.owner }}/zzpanel-backup:nightly
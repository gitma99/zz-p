name: CI - Code Quality

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP Syntax Check (Lint)
        run: |
          find . -name "*.php" -not -path "*/.git/*" -not -path "*/__TEMP__/*" -not -path "*/__LOCAL__/*" -print0 | xargs -0 -n 1 php -l

      - name: Run ShellCheck
        uses: koalaman/shellcheck-action@v2
        with:
          path: |
            install.sh
            update.sh
            docker-entrypoint.sh

      - name: Run Gitleaks (Secret Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

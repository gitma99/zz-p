services:
  app:
    image: ghcr.io/gitma99/zzpanel-app:${APP_VERSION:-latest}
    container_name: zzpanel_app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    environment:
      DB_HOST: mysql
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      LOG_BUFFER_SIZE: ${LOG_BUFFER_SIZE:-1000}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_TELEGRAM_ENABLED: ${LOG_TELEGRAM_ENABLED:-true}
      LOG_TELEGRAM_MIN_LEVEL: ${LOG_TELEGRAM_MIN_LEVEL:-ERROR}
      LOG_TELEGRAM_DEDUP_SECONDS: ${LOG_TELEGRAM_DEDUP_SECONDS:-3600}
      LOG_TELEGRAM_DEDUP_ENABLED: ${LOG_TELEGRAM_DEDUP_ENABLED:-false}
    volumes:
      - ./logs/app:/var/www/html/ZZPanelBot/logs
      # /var/log/apache2 intentionally NOT mounted: per-vhost ErrorLog/
      # CustomLog go to stdout/stderr (docker logs). Only the one-time
      # global startup error log would land in the image's own dir.
      - app_temp:/var/www/html/ZZPanelBot/temp
    healthcheck:
      # Liveness only: TCP accept on Apache. No PHP/index.php, no DB.
      # curl WITHOUT -f: 403 from "/" still proves Apache up.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: zzpanel_mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      # tuning lives ONLY in lowcpu.cnf — never duplicate the values via command: (drift risk)
      - ./docker/mysql/lowcpu.cnf:/etc/mysql/conf.d/lowcpu.cnf:ro
      - ./logs/mysql:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: zzpanel_phpmyadmin
    restart: unless-stopped
    profiles: ["phpmyadmin"]
    env_file: .env
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DOMAIN}/phpmyadmin/
    healthcheck:
      # No -f: TCP accept only. OLD "curl -f /" rendered the login form
      # (PHP + DB session) every 60s. Avoid that.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: zzpanel_nginx
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      # Process check only. No HTTP probe: template returns 444 for
      # unknown hosts, so "curl -f localhost" would always fail.
      test: ["CMD", "pidof", "nginx"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    container_name: zzpanel_certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    healthcheck:
      # Timer loop, no port. PID-alive == scheduler alive.
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 60s

  backup:
    image: ghcr.io/gitma99/zzpanel-backup:latest
    container_name: zzpanel_backup
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      BACKUP_TELEGRAM_TOKEN: ${BACKUP_TELEGRAM_TOKEN:-}
      BACKUP_CHAT_ID: ${BACKUP_CHAT_ID:-}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-}
      BACKUP_MAX_RETRIES: ${BACKUP_MAX_RETRIES:-}
    volumes:
      - ./data/backups:/backups
    healthcheck:
      # Loop service, no port. PID alive AND log present. Never runs
      # backup.sh (mysqldump) as a healthcheck.
      test: ["CMD-SHELL", "kill -0 1 && test -s /backups/backup.log"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  worker:
    image: ghcr.io/gitma99/zzpanel-app:latest
    container_name: zzpanel_worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    environment:
      DB_HOST: mysql
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      LOG_BUFFER_SIZE: ${LOG_BUFFER_SIZE:-1000}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_TELEGRAM_ENABLED: ${LOG_TELEGRAM_ENABLED:-true}
      LOG_TELEGRAM_MIN_LEVEL: ${LOG_TELEGRAM_MIN_LEVEL:-ERROR}
      LOG_TELEGRAM_DEDUP_SECONDS: ${LOG_TELEGRAM_DEDUP_SECONDS:-3600}
      LOG_TELEGRAM_DEDUP_ENABLED: ${LOG_TELEGRAM_DEDUP_ENABLED:-false}
    volumes:
      - ./logs/worker:/var/www/html/ZZPanelBot/logs
      - app_temp:/var/www/html/ZZPanelBot/temp
    command: ["worker"]
    healthcheck:
      # MUST override image HEALTHCHECK (Dockerfile:68 curl on / — worker
      # never starts Apache). Check PID1 is the worker via /proc — no
      # pgrep needed (procps not in Dockerfile apt list).
      test: ["CMD-SHELL", "kill -0 1 && grep -q task_worker.php /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_temp:
